    <script>
 document.addEventListener("DOMContentLoaded", () => {
    const grid = document.querySelector('.gallery');
    imagesLoaded(grid, function() {
        new Masonry(grid, {
            itemSelector: '.gallery-item',
            columnWidth: 300, // Fixed column width (matches CSS)
            fitWidth: true,   // Centers the grid within its container
            gutter: 0         // No gaps between items
        });
        grid.classList.add('masonry-loaded'); // Show the gallery
    });
});
